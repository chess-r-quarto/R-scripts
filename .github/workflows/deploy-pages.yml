name: Deploy Quarto / HTML to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site
          # トップページとして poisson_guide.html を index.html に配置
          if [ -f poisson_guide.html ]; then
            cp poisson_guide.html _site/index.html
            cp poisson_guide.html _site/poisson_guide.html
          fi
          # 画像や動画、CSS、Rスクリプト、QMDファイルもコピー
          cp *.gif _site/ 2>/dev/null || true
          cp *.mp4 _site/ 2>/dev/null || true
          cp *.css _site/ 2>/dev/null || true
          cp *.R _site/ 2>/dev/null || true
          cp *.qmd _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
